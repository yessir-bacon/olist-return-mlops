name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/olist-mlops/olist/olist-api

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy olist-api \
            --image $IMAGE:${{ github.sha }} \
            --region us-central1 --port 8080 --memory 1Gi \
            --min-instances 0 --max-instances 1 --allow-unauthenticated \
            --set-env-vars MODEL_DIR=gs://olist-mlops-models/latest